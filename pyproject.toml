[project]
name = "recovery"
version = "0.1.0"
description = "Bounded revenue recovery agent for subscription e-mandate dunning"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The policy engine, batch runner and metrics have no runtime dependencies and
# run offline. Only the live model clients need an SDK, and each imports lazily,
# so `--agent off` and `--agent scripted` work with neither extra installed.
# max_completion_tokens is why the openai floor is 1.45 -- the reasoning models
# reject the older max_tokens parameter.
openai = ["openai>=1.45"]
anthropic = ["anthropic>=0.69"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recovery"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
