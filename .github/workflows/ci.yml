name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/
